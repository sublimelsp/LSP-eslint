name: Check settings

on:
  pull_request:
    branches:
    - main

jobs:
  check-new-settings:
    uses: sublimelsp/workflows/.github/workflows/changed-settings.yaml@v3
    with:
      version_file: 'plugin.py'
      version_regexp: 'TAG = ''([^'']+)'''
    secrets:
      SUBLIMELSP_APP_PRIVATE_KEY: ${{ secrets.SUBLIMELSP_APP_PRIVATE_KEY }}

  update-server:
    needs: check-new-settings
    # Also when the settings need review, which fails check-new-settings.
    if: ${{ !cancelled() && needs.check-new-settings.outputs.version_changed == 'true' }}
    runs-on: ubuntu-latest
    env:
      # PRs from forks get no secrets, so the server can't be pushed for them.
      IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      # Pushes made with GITHUB_TOKEN don't trigger workflows, so the smoke test wouldn't run on the compiled server.
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: env.IS_FORK == 'false'
        with:
          client-id: ${{ vars.SUBLIMELSP_APP_CLIENT_ID }}
          private-key: ${{ secrets.SUBLIMELSP_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Update server
        env:
          VERSION: ${{ needs.check-new-settings.outputs.new_version }}
        run: ./language-server/compile-language-server.sh "$VERSION"

      # Fails while the server isn't compiled for the new version, so that the PR isn't merged before it is. The push
      # runs the checks again on the new commit.
      - name: Push the compiled server
        env:
          BRANCH: ${{ github.head_ref }}
          COMMIT_MESSAGE: '[automated commit] update server'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi
          git status --short | head -20
          if [ "$IS_FORK" = 'true' ]; then
            echo "::error::The server needs to be compiled for the new version: run ./language-server/compile-language-server.sh"
            exit 1
          fi
          # A rebuild of the commit that this job pushed would push again, and so on.
          if [ "$(git log -1 --format=%s)" = "$COMMIT_MESSAGE" ]; then
            echo "::error::Compiling the server again changed the output, so the build isn't reproducible."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "$COMMIT_MESSAGE"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "::error::Pushed the compiled server to the PR. The checks run again on the new commit."
          exit 1
